name: MeridianCare
options:
  bundleIdPrefix: com.meridiancare.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.0
targets:
  MeridianCare:
    type: application
    platform: iOS
    sources:
      - path: MeridianCare
    resources:
      - path: MeridianCare/Resources
    info:
      path: MeridianCare/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        MERIDIAN_SUPABASE_URL: $(MERIDIAN_SUPABASE_URL)
        MERIDIAN_SUPABASE_ANON_KEY: $(MERIDIAN_SUPABASE_ANON_KEY)
    # Must be a target-level key, NOT nested under `settings:` — XcodeGen
    # 2.45.4 silently drops it if nested (confirmed empirically while
    # building MeridianHub: nested form produced zero baseConfigurationReference
    # entries and no error, so MERIDIAN_SUPABASE_URL/ANON_KEY never resolved
    # and the app showed "no Supabase project configured" with no diagnostic).
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meridiancare.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
schemes:
  MeridianCare:
    build:
      targets:
        MeridianCare: all
    run:
      config: Debug
