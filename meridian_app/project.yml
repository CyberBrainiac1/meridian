name: Meridian
options:
  bundleIdPrefix: com.meridiansuite.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.0
targets:
  Meridian:
    type: application
    platform: iOS
    # Info.plist is GENERATED into Meridian/ at `xcodegen generate` time, and
    # Resources/ lives there too. Globbing the folder without excluding them
    # means each is registered both as a build input and as a copied resource
    # -> "Multiple commands produce ...Info.plist". Exclude both here and
    # declare Resources once, explicitly, below.
    sources:
      - path: Meridian
        excludes:
          - "Resources"
    resources:
      - path: Meridian/Resources
    # Generated OUTSIDE Meridian/ on purpose. XcodeGen writes this file at
    # generate time, and anything inside the globbed source folder gets picked
    # up as a copied resource as well as being INFOPLIST_FILE -- which Xcode
    # rejects with "Multiple commands produce ...Info.plist".
    info:
      path: Generated/Info.plist
      properties:
        # An EMPTY UILaunchScreen renders the system background, which is
        # BLACK on a device in dark mode — so every cold start began with a
        # black screen for as long as launch took. Naming the app's own
        # background colour makes launch continuous with the first real
        # frame instead of a void the user assumes is a crash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        MERIDIAN_SUPABASE_URL: $(MERIDIAN_SUPABASE_URL)
        MERIDIAN_SUPABASE_ANON_KEY: $(MERIDIAN_SUPABASE_ANON_KEY)
    # Target-level, NOT nested under `settings:` — XcodeGen silently drops it
    # when nested, with no error, and the Supabase values then resolve to the
    # literal placeholder at runtime.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meridiansuite.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
schemes:
  Meridian:
    build:
      targets:
        Meridian: all
    run:
      config: Debug
